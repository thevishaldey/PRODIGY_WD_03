<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind to use class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 relative">

    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition-all text-gray-800 dark:text-yellow-400 focus:outline-none">
        <!-- Sun Icon (Hidden in Light Mode) -->
        <svg id="sunIcon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <!-- Moon Icon (Hidden in Dark Mode) -->
        <svg id="moonIcon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 flex flex-col items-center transition-colors duration-300">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 mb-6 transition-all">
            Tic-Tac-Toe
        </h1>

        <!-- Controls: Game Mode & Voice -->
        <div class="flex items-center gap-4 mb-4 w-full justify-center">
            <select id="gameMode" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 shadow-sm cursor-pointer transition-colors">
                <option value="pvp">Player vs Player</option>
                <option value="ai">Player vs AI</option>
            </select>
            <button id="voiceToggle" class="p-2.5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors text-gray-600 dark:text-gray-300 shadow-sm" title="Toggle AI Voice">
                <!-- Muted Speaker Icon by default -->
                <svg id="speakerOff" class="w-5 h-5 block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                <!-- Active Speaker Icon -->
                <svg id="speakerOn" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            </button>
        </div>

        <!-- Status Display -->
        <div id="status" class="text-xl font-semibold mb-6 h-8 text-gray-600 dark:text-gray-300 flex items-center justify-center w-full bg-gray-50 dark:bg-gray-700 rounded-lg p-2 border border-gray-100 dark:border-gray-600 transition-colors duration-300">
            Player X's turn
        </div>

        <!-- Game Board Container -->
        <div id="board" class="grid grid-cols-3 gap-2 bg-gray-300 dark:bg-gray-600 p-2 rounded-xl w-full aspect-square mb-8 transition-colors duration-300">
            <!-- 9 Interactive Cells -->
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="0"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="1"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="2"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="3"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="4"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="5"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="6"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="7"></div>
            <div class="cell bg-white dark:bg-gray-800 rounded-lg flex items-center justify-center text-6xl md:text-7xl font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 select-none shadow-sm" data-index="8"></div>
        </div>

        <!-- AI Commentary Box -->
        <div id="commentaryBox" class="w-full mb-6 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800 text-indigo-800 dark:text-indigo-200 text-sm italic text-center hidden transition-all duration-300 relative overflow-hidden min-h-[4rem] flex items-center justify-center shadow-inner">
            <div id="commentaryText">"I am Gemini. Prepare to lose, human."</div>
            <div id="aiLoading" class="absolute inset-0 bg-indigo-50 dark:bg-indigo-900 flex items-center justify-center hidden">
                <svg class="animate-spin h-5 w-5 text-indigo-600 dark:text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="ml-2 text-indigo-700 dark:text-indigo-300 font-semibold text-xs uppercase tracking-wider">Gemini is thinking...</span>
            </div>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="px-6 py-3 bg-gradient-to-r from-gray-700 to-gray-900 dark:from-gray-600 dark:to-gray-800 text-white font-bold rounded-lg shadow-md hover:shadow-lg hover:from-gray-800 hover:to-black dark:hover:from-gray-500 dark:hover:to-gray-700 transition-all transform hover:-translate-y-0.5 active:translate-y-0 w-full md:w-auto">
            Restart Game
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
